[system]
language = "${env:DBGPT_LANG:-en}"
api_keys = []
encrypt_key = "${env:DBGPT_ENCRYPT_KEY}"

[service.web]
host = "0.0.0.0"
port = 5670
cors_allowed_origins = "${env:DBGPT_CORS_ALLOWED_ORIGINS:-http://localhost:5670}"

[service.web.agent_context]
max_context_tokens = 0
reserved_tokens = 4096
warning_threshold = 0.70
error_threshold = 0.90
critical_threshold = 0.95
min_keep_recent_rounds = 3
max_observation_age_rounds = 5
truncated_observation_max_chars = 200
min_keep_tokens = 10000
max_compact_failures = 3
max_parallel_subagents = 3

[service.web.database]
type = "mysql"
host = "${env:MYSQL_HOST:-db}"
port = "${env:MYSQL_PORT:-3306}"
database = "${env:MYSQL_DATABASE:-dbgpt}"
user = "${env:MYSQL_USER:-root}"
password = "${env:MYSQL_PASSWORD}"

[service.model.worker]
host = "127.0.0.1"

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

[models]
[[models.llms]]
name = "${env:LLM_MODEL_NAME:-qwen3.8-flash}"
provider = "proxy/tongyi"
api_base = "${env:DASHSCOPE_API_BASE}"
api_key = "${env:DASHSCOPE_API_KEY}"

[[models.embeddings]]
name = "${env:EMBEDDING_MODEL_NAME:-text-embedding-v3}"
provider = "proxy/tongyi"
api_url = "${env:DASHSCOPE_EMBEDDING_API_URL}"
api_key = "${env:DASHSCOPE_API_KEY}"
